<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d2878"><title>CEPA Altomira · Control Operativo</title><link rel="stylesheet" href="assets/css/app.css"></head><body><header class="topbar"><div class="topbar-inner brand"><div class="municipal-brand"><img src="assets/img/escudo-tarancon.png" alt="Ayuntamiento de Tarancón"><div><h1>CEPA Altomira</h1><p>Control operativo · Ayuntamiento de Tarancón</p></div></div><img class="bohemio-logo" src="https://raw.githubusercontent.com/bohemio-ws/RTC/main/logo-bohemio.jpg" alt="Bohemio 4 Infinity"></div></header><main class="shell"><section id="view-home" class="view"><div class="hero"><span class="eyebrow">AYUNTAMIENTO DE TARANCÓN</span><h2>Panel de trabajo</h2><p>Registro operativo diario del CEPA Altomira.</p></div><div id="moduleGrid" class="grid"></div></section><section id="view-trabajo" class="view"><div class="view-head"><button class="back" type="button">←</button><h2>Trabajo diario</h2></div><form id="dailyForm"><div class="panel"><div class="field"><label>Estado del centro</label><select id="dailyStatus"><option value="Limpieza completada">Limpieza completada</option><option value="Pendiente">Pendiente</option><option value="Incidencia">Incidencia</option></select></div><div id="rooms"></div><div class="field"><label>Observaciones generales</label><textarea id="dailyNotes" rows="4"></textarea></div><button class="btn primary">Guardar parte</button><div id="dailyMsg" class="status"></div></div></form></section><section id="view-historico" class="view"><div class="view-head"><button class="back" type="button">←</button><h2>Calendario e informes</h2></div><div class="panel"><div class="field"><label>Selecciona una fecha</label><input id="historyDate" type="date"></div><div id="historyResult"></div></div></section><section id="view-evidencias" class="view"><div class="view-head"><button class="back" type="button">←</button><h2>Evidencias fotográficas</h2></div><form id="evidenceForm" class="panel"><div class="field"><label>Zona / motivo</label><input name="area" required></div><div class="field"><label>Fotografía</label><input name="photo" type="file" accept="image/*" capture="environment" required></div><div class="field"><label>Descripción</label><textarea name="notes" rows="3"></textarea></div><button class="btn primary">Guardar evidencia</button><div id="evidenceMsg" class="status"></div></form><div class="panel" id="evidenceList"></div></section><section id="view-incidencias" class="view"><div class="view-head"><button class="back" type="button">←</button><h2>Incidencias</h2></div><form id="incidentForm" class="panel"><div class="field"><label>Zona</label><input name="area" required></div><div class="field"><label>Tipo</label><select name="type"><option>Limpieza</option><option>Fontanería</option><option>Electricidad</option><option>Mobiliario</option><option>Seguridad</option><option>Otra</option></select></div><div class="field"><label>Prioridad</label><select name="priority"><option>Normal</option><option>Alta</option><option>Urgente</option></select></div><div class="field"><label>Descripción</label><textarea name="description" required rows="4"></textarea></div><div class="field"><label>📷 Evidencia fotográfica</label><input name="photo" type="file" accept="image/*" capture="environment"></div><button class="btn primary">Registrar incidencia</button></form><div class="panel" id="incidentList"></div></section><section id="view-almacen" class="view"><div class="view-head"><button class="back" type="button">←</button><h2>Almacén y stock</h2></div><form id="stockForm" class="panel"><div class="field"><label>Producto</label><input name="product" required></div><div class="field"><label>Cantidad actual</label><input name="quantity" type="number" min="0" step="0.01" required></div><div class="field"><label>Unidad</label><select name="unit"><option>ud.</option><option>litros</option><option>kg</option><option>cajas</option><option>rollos</option></select></div><div class="field"><label>Stock mínimo</label><input name="minimum" type="number" min="0" step="0.01"></div><div class="field"><label>📷 Foto del producto / almacén</label><input name="photo" type="file" accept="image/*" capture="environment"></div><button class="btn primary">Guardar stock</button></form><div class="panel" id="stockList"></div></section><section id="view-pedidos" class="view"><div class="view-head"><button class="back" type="button">←</button><h2>Pedidos</h2></div><form id="orderForm" class="panel"><div class="field"><label>Proveedor / destinatario</label><input name="supplier" required></div><div class="field"><label>Productos y cantidades</label><textarea name="items" rows="5" required></textarea></div><div class="field"><label>Observaciones</label><textarea name="notes" rows="3"></textarea></div><div class="field"><label>📷 Foto del pedido / albarán / material</label><input name="photo" type="file" accept="image/*" capture="environment"></div><button class="btn primary">Preparar pedido</button></form><div class="panel actions"><button id="shareWa" type="button" class="btn secondary">WhatsApp</button><button id="shareMail" type="button" class="btn secondary">Correo</button></div><div class="panel" id="orderList"></div></section><section id="view-suministros" class="view"><div class="view-head"><button class="back" type="button">←</button><h2>Suministros</h2></div><form id="supplyForm" class="panel"><div class="field"><label>Tipo</label><select name="kind"><option>Gasoil</option><option>Material de limpieza</option><option>Consumibles</option><option>Otro suministro</option></select></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" min="0" step="0.01" required></div><div class="field"><label>Unidad</label><input name="unit" value="litros" required></div><div class="field"><label>Proveedor</label><input name="provider"></div><div class="field"><label>Observaciones</label><textarea name="notes" rows="3"></textarea></div><div class="field"><label>📷 Foto de entrega / albarán</label><input name="photo" type="file" accept="image/*" capture="environment"></div><button class="btn primary">Registrar entrada</button></form><div class="panel" id="supplyList"></div></section><section id="view-informes" class="view"><div class="view-head no-print"><button class="back" type="button">←</button><h2>Informe operativo</h2></div><div class="panel" id="reportBody"></div><div class="actions no-print"><button id="printReport" type="button" class="btn primary">Imprimir / PDF</button></div><div id="reportMsg" class="status no-print"></div></section></main><script type="module" src="assets/js/app.js"></script></body></html>
