name: Build PWA icons

on:
  push:
    paths:
      - 'assets/icons/ayto-tarancon-icon.svg'
      - '.github/workflows/build-pwa-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CEPA PWA icons from current municipal identity
        run: |
          python -m pip install --quiet pillow cairosvg
          python - <<'PY'
          from pathlib import Path
          import cairosvg
          src='assets/icons/ayto-tarancon-icon.svg'
          out=Path('assets/icons'); out.mkdir(parents=True,exist_ok=True)
          for size in (192,512):
              cairosvg.svg2png(url=src,write_to=str(out/f'cepa-{size}.png'),output_width=size,output_height=size)
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace('<link rel="icon" type="image/png" href="assets/icons/cepa-192.png">','<link rel="icon" type="image/svg+xml" href="assets/icons/ayto-tarancon-icon.svg">')
          text=text.replace('<link rel="apple-touch-icon" href="assets/icons/cepa-512.png">','<link rel="apple-touch-icon" href="assets/icons/cepa-512.png">')
          p.write_text(text,encoding='utf-8')
          PY
      - name: Commit generated PWA assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/icons/cepa-192.png assets/icons/cepa-512.png index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Regenerate CEPA icons from current municipal identity'
          git push
